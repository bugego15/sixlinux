# 优先尝试从 A/B 磁盘的 FAT 启动分区加载 boot.scr；
# 没有该分区时回退到 QEMU loader 直接加载内核的传统启动方式。
CONFIG_BOOTCOMMAND="setenv scriptaddr 0x49000000; if fatload virtio 0:1 ${scriptaddr} boot.scr; then source ${scriptaddr}; fi; setenv bootargs root=/dev/vda rw console=ttyAMA0 earlycon=pl011,0x09000000 keep_bootcon ip=dhcp swiotlb=0; booti 0x40200000 - 0x44000000"
