require conf/distro/poky.conf

DISTRO = "sixlinux"
DISTRO_NAME = "SixLinux"
DISTRO_VERSION = "0.1.0"
MAINTAINER = "SixLinux Project"

# 无桌面初版：不引入 Poky 默认的 Wayland、OpenGL、Vulkan 等特性。
POKY_DEFAULT_DISTRO_FEATURES = ""

INIT_MANAGER = "systemd"

# 自有 opkg 软件源的基础地址。默认指向 QEMU slirp 网关上的本机 feed，
# 可在 local.conf 中覆盖为局域网或公网 HTTPS 地址。
SIXLINUX_FEED_BASE ?= "http://10.0.2.2:8080"

# opkg 需要 GPG 验签和 HTTPS 下载能力。
PACKAGECONFIG:append:pn-opkg = " gpg ssl-curl"
