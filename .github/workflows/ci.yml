name: SixLinux CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make git wget curl ca-certificates gawk \
            diffstat unzip texinfo chrpath socat cpio python3 python3-pexpect \
            python3-pip python3-venv python3-git python3-jinja2 python3-subunit \
            xz-utils debianutils iputils-ping zstd liblz4-tool file libacl1 \
            locales pkg-config ninja-build cmake gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu bison flex \
            libssl-dev device-tree-compiler swig python3-dev python3-setuptools \
            uuid-dev libgnutls28-dev openssl bc libncurses-dev libelf-dev \
            qemu-system-arm qemu-utils ipxe-qemu expect netcat-openbsd \
            openssh-client iproute2 rsync parted dosfstools mtools e2fsprogs
          sudo locale-gen en_US.UTF-8

      - name: Allow unprivileged user namespaces
        run: |
          # Ubuntu 24.04 默认用 AppArmor 限制非特权 user namespace，
          # BitBake 的 fakeroot 需要打开该开关才能运行。
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Cache Yocto inputs
        uses: actions/cache@v4
        with:
          path: |
            cache/downloads
            cache/sstate-cache
          key: yocto-${{ runner.os }}-${{ hashFiles('sources/versions.env', 'layers/**', 'scripts/**', 'packages/**') }}
          restore-keys: |
            yocto-${{ runner.os }}-

      - name: Build and test
        run: ./scripts/ci.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sixlinux-release
          path: artifacts/releases/
